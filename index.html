<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&family=Roboto+Slab:wght@100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <title>Frontend Mentor | Contact form</title>
  </head>
  <body>

    <div id="alert">
      <div id="alert-header">
        <img src="icon-success-check.svg" alt="Success Icon">
        <p>Message Sent!</p>
      </div>
      <p>Thanks for completing the form. We'll be in touch soon!</p>
    </div>

    <main>
      <h1>Contact Us</h1>

      <form>
        <div id="personal-data">
          <div>
            <label for="first-name">First Name<span class="star">*</span></label>
            <input type="text" id="first-name" name="first-name" required>
            <span class="error-message">This field is required</span>
          </div>

          <div>
            <label for="last-name">Last Name<span class="star">*</span></label>
            <input type="text" id="last-name" name="last-name" required>
            <span class="error-message">This field is required</span>
          </div>

          <div>
            <label for="email">Email Address<span class="star">*</span></label>
            <input type="email" id="email" name="email" required>
            <span class="error-message">Please enter a valid email address</span>
          </div>
        </div>
        
        <div id="radio-group">
          <h2>Query Type<span class="star">*</span></h2>
          <label id="general-enquiry">
            <input type="radio" name="query-type" id="general-enquiry-button" value="general-enquiry" required>
            <div class="checkmark-radio"></div>
            <span">General Enquiry</span>
          </label>
          <label id="support-request">
            <input type="radio" name="query-type" id="support-request-button" value="support-request" required>
            <div class="checkmark-radio"></div>
            <span>Support Request</span>
          </label>
          <span class="error-message">Please select a query type</span>
        </div>

        <div id="message-container">
          <label for="message">Message<span class="star">*</span></label>
          <textarea id="message" name="message" required></textarea>
          <span class="error-message">This field is required</span>
        </div>

        <div id="checkbox-container">
          <label id="checkbox">
            <input type="checkbox" id="consent" name="consent" required>
            <div id="checkmark"></div>
            <span>I consent to being contacted by the team<span class="star">*</span></span>
            <span class="error-message">To submit this form, please consent to being contacted</span>
          </label>
        </div>

        <button type="submit">Submit</button>
      </form>
    </main>
    <script src="main.js"></script>
  </body>
</html>
